<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChatX</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0B0F14;
  color: white;
}

header {
  background: #111827;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 1px solid #333;
}

#chat {
  height: 70vh;
  overflow-y: auto;
  padding: 10px;
}

.message {
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
}

.me {
  background: #00bcd4;
  margin-left: auto;
  color: black;
}

.other {
  background: #1f2937;
}

#inputBox {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #111827;
  padding: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  border-radius: 10px;
  background: #00bcd4;
  color: black;
  cursor: pointer;
}
</style>
</head>

<body>

<header>💬 ChatX</header>

<div id="chat"></div>

<div id="inputBox">
  <input id="message" placeholder="Type a message..." />
  <button onclick="sendMessage()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA3o3CHKaORvCNlNpUCIU2MmaeVM6w_coo",
  authDomain: "chatx-781cf.firebaseapp.com",
  projectId: "chatx-781cf"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 👤 اسم عشوائي
const user = "User_" + Math.floor(Math.random()*10000);

// إرسال رسالة
function sendMessage() {
  const msg = document.getElementById("message").value;
  if(msg === "") return;

  db.collection("messages").add({
    text: msg,
    user: user,
    time: Date.now()
  });

  document.getElementById("message").value = "";
}

// استقبال الرسائل (Real-time)
db.collection("messages")
.orderBy("time")
.onSnapshot(snapshot => {

  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.classList.add("message");

    if(data.user === user){
      div.classList.add("me");
    } else {
      div.classList.add("other");
    }

    div.innerHTML = "<b>" + data.user + ":</b><br>" + data.text;
    chat.appendChild(div);
  });

  chat.scrollTop = chat.scrollHeight;
});
</script>

</body>
</html>
